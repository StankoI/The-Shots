<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            margin: 0;
            width: 100%;
            height: 1000px;
            background: black;
        }

        h4 {
            position: relative;
            margin: 1px;
            left: 40px;
            /* color: white; */
            text-shadow: 0 0 15px white;
            font-size: 20px;
        }

        .container {
            position: absolute;
            top: 200px;
            display: flex;
            justify-content: center;
            align-items: center;
            align-content: start;
            gap: 20px;
            /* justify-content: space-evenly; */
            flex-wrap: wrap;
            width: 100%;
            height: 100%;
        }

        .element {
            position: relative;
            width: max(270px, 360px);
            height: max(360px, 540px);
            background: rgb(4, 0, 18);
            display: grid;
            align-items: center;
            justify-items: center;
            grid-template-columns: 1fr 1fr 1fr 1fr 1fr 1fr;
            grid-template-rows: 1fr 1fr 1fr 1fr 1fr 1fr 1fr 1fr 1fr;
            border: 1px solid #07c;
            box-shadow: 0 0 10px #07c;
            transition: all 0.5s;
            cursor: pointer;
        }

        .element:hover {
            box-shadow: 0 0 30px #07c;
        }

        .name {
            position: relative;
            grid-column: 1/4;
            grid-row: 7/8;
            color: white;
            text-shadow: 0 0 15px white;
            font-size: 40px;
        }

        .price {
            position: relative;
            grid-column: 4/7;
            grid-row: 7/8;
            color: white;
            text-shadow: 0 0 10px white;
            font-size: 30px;
        }

        .img {
            grid-column: 1/7;
            grid-row: 1/7;
            width: max(270px, 300px);
            height: max(270px, 300px);
            background-image: url("./shotImg.png");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            border: 1px solid #07c;
            box-shadow: 0 0 10px #07c;
        }

        .ingredients {
            position: absolute;
            /* background: red; */
            grid-row: 8/10;
            grid-column: 1/7;
            width: 100%;
            height: 100%;
            color: white;
        }
    </style>
    <script src="../Js/shakersOfTheWeek.js" defer></script>
</head>

<body>
    <div>shakers</div>
    <div class="container" id="container">
        
    </div>
    <script>
        obj = new ShakersOfTheWeek();
        
    </script>
</body>

</html>
